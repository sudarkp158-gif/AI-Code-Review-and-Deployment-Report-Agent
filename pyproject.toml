[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-agent"
version = "0.1.0"
description = "Explainable engineering risk analysis for GitHub issues, pull requests, and releases"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
engineering-agent = "engineering_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
